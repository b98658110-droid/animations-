<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I love you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #3a0a1c 0%, #16030b 45%, #050002 100%);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; display: block; }

  .love {
    position: fixed;
    left: 50%;
    top: calc(50% - 12vmin);
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
  }
  .love h1 {
    font-family: 'Great Vibes', cursive;
    font-weight: 400;
    font-size: 15vmin;
    line-height: 1.25;
    padding: 0 .35em;
    background: linear-gradient(100deg, #ff8fab 0%, #ffffff 22%, #ffb3c6 40%, #ff4d6d 58%, #fff0f3 78%, #ff8fab 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 60, 110, .9)) drop-shadow(0 0 28px rgba(255, 30, 80, .55));
    clip-path: inset(0 100% 0 0);
    opacity: 0;
  }
  .love p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 2.6vmin;
    letter-spacing: .5em;
    padding-left: .5em;
    color: #ffd6e0;
    text-shadow: 0 0 10px rgba(255, 80, 130, .9);
    margin-top: -.6em;
    opacity: 0;
  }
  .love.show h1 {
    animation: write 3s cubic-bezier(.45, .05, .25, 1) forwards,
               shimmer 5s linear infinite;
  }
  .love.show p { animation: fadeUp 2.2s ease 2.6s forwards; }

  @keyframes write {
    0%   { clip-path: inset(0 100% 0 0); opacity: 1; }
    100% { clip-path: inset(0 0 0 0);    opacity: 1; }
  }
  @keyframes shimmer {
    from { background-position: 0% 0; }
    to   { background-position: 250% 0; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); filter: blur(6px); }
    to   { opacity: .9; transform: none; filter: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="love" id="love">
  <h1>I love you</h1>
  <p>you are my everything</p>
</div>

<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const love = document.getElementById('love');

let W, H, S, CX, CY, MIN;
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cvs.width = W * d; cvs.height = H * d;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
  MIN = Math.min(W, H);
  S = MIN * 0.026;           // 1 "heart unit" in pixels
  CX = W / 2; CY = H / 2;
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

// classic heart curve
function heartXY(t) {
  const s = Math.sin(t);
  return [16 * s * s * s, 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)];
}

// pre-rendered glowing dot
function glowSprite(rgb) {
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.12, `rgba(${rgb},0.95)`);
  g.addColorStop(0.4, `rgba(${rgb},0.28)`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = g;
  x.fillRect(0, 0, s, s);
  return c;
}

// pre-rendered little glowing heart
function heartSprite(color) {
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  x.translate(32, 30);
  x.shadowColor = color; x.shadowBlur = 14;
  x.fillStyle = color;
  x.beginPath();
  for (let i = 0; i <= 80; i++) {
    const [hx, hy] = heartXY(i / 80 * TAU);
    x.lineTo(hx * 1.15, -hy * 1.15);
  }
  x.fill();
  return c;
}

const SPR = [glowSprite('255,40,90'), glowSprite('255,95,140'), glowSprite('255,160,190'), glowSprite('255,225,235')];
const HEART_SPR = heartSprite('#ff4d7a');

// ---------- heart particles ----------
const N = MIN < 600 ? 1500 : 2600;
const parts = [];
for (let i = 0; i < N; i++) {
  const t = Math.random() * TAU;
  const [hx, hy] = heartXY(t);
  const u = Math.random();
  let r;
  if (u < 0.62)      r = 1 + (Math.random() - 0.5) * 0.06;   // outline
  else if (u < 0.85) r = rand(0.82, 1);                     // inner rim
  else               r = Math.sqrt(Math.random()) * 0.85;   // sparse fill
  const x = hx * r, y = -(hy + 2.5) * r;
  const len = Math.hypot(x, y) || 1;
  const nx = x / len, ny = y / len;
  const ang = rand(-0.45, 0.45), dir = Math.random() < 0.75 ? 1 : -0.55;
  parts.push({
    tx: x, ty: y, nx, ny,
    sdx: (nx * Math.cos(ang) - ny * Math.sin(ang)) * dir,
    sdy: (nx * Math.sin(ang) + ny * Math.cos(ang)) * dir,
    sx: (Math.random() - 0.5) * 1.5, sy: (Math.random() - 0.5) * 1.5,  // start as screen fraction
    delay: rand(0, 2.2) + (r < 0.8 ? 0.7 : 0),
    dur: rand(1.6, 2.6),
    swirl: rand(-0.35, 0.35),
    size: rand(0.5, 1.4) * (r > 0.95 ? 1.1 : 0.8),
    spr: SPR[(Math.random() * SPR.length) | 0],
    ph: Math.random() * TAU,
    kick: r > 0.95 ? rand(0, 1.3) : rand(0, 0.3),
    spike: r > 0.95 && Math.random() < 0.25,
    slen: rand(1, 4.8),
  });
}

// ---------- background ----------
const stars = Array.from({ length: 220 }, () => ({
  x: Math.random(), y: Math.random(), r: rand(0.4, 1.4), ph: Math.random() * TAU, sp: rand(0.5, 2.2),
}));
function newFloater(init) {
  return { x: Math.random(), y: init ? Math.random() : 1.08, s: rand(8, 22), sp: rand(0.015, 0.04),
           sw: rand(0.5, 1.4), ph: Math.random() * TAU, a: rand(0.08, 0.3) };
}
const floaters = Array.from({ length: 24 }, () => newFloater(true));

// ---------- click bursts ----------
const bursts = [];
function burst(x, y) {
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * TAU, v = rand(60, 380);
    bursts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: rand(0.8, 1.8),
                  size: rand(5, 13), spr: SPR[i % 4], up: 0 });
  }
  // particles that expand in the shape of a heart
  for (let i = 0; i < 60; i++) {
    const [hx, hy] = heartXY(i / 60 * TAU);
    bursts.push({ x, y, vx: hx * 13, vy: -hy * 13, life: 0, max: 1.6, size: rand(6, 11), spr: SPR[1 + (i % 3)], up: 0 });
  }
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * TAU, v = rand(40, 170);
    bursts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0, max: rand(1.6, 2.6),
                  size: rand(14, 28), spr: HEART_SPR, up: 40 });
  }
}
addEventListener('pointerdown', e => burst(e.clientX, e.clientY));

// ---------- loop ----------
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
function beat(t) {               // "lub-dub"
  const ph = t % 1.15;
  return Math.exp(-(((ph - 0.1) / 0.07) ** 2)) + 0.55 * Math.exp(-(((ph - 0.36) / 0.08) ** 2));
}

const T0 = performance.now();
let last = T0, textShown = false;

function frame(now) {
  const T = (now - T0) / 1000;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  ctx.clearRect(0, 0, W, H);
  const ramp = clamp01((T - 3) / 1.2);
  const b = beat(T) * ramp;
  const k = 1 + 0.065 * b;
  const appear = clamp01((T - 1.5) / 2.5);

  // stars
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#fff';
  for (const s of stars) {
    ctx.globalAlpha = 0.15 + 0.55 * (0.5 + 0.5 * Math.sin(T * s.sp + s.ph));
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }
  // floating hearts
  for (const f of floaters) {
    f.y -= f.sp * dt;
    if (f.y < -0.08) Object.assign(f, newFloater(false));
    const x = f.x * W + Math.sin(T * f.sw + f.ph) * 25;
    ctx.globalAlpha = f.a * clamp01((1.08 - f.y) * 3);
    ctx.drawImage(HEART_SPR, x - f.s / 2, f.y * H - f.s / 2, f.s, f.s);
  }

  ctx.globalCompositeOperation = 'lighter';

  // inner glow
  const gy = CY - 2 * S;
  const gr = ctx.createRadialGradient(CX, gy, 0, CX, gy, 17 * S * k);
  gr.addColorStop(0, `rgba(255,40,90,${0.3 * appear * (0.75 + 0.5 * b)})`);
  gr.addColorStop(0.55, `rgba(200,20,60,${0.13 * appear})`);
  gr.addColorStop(1, 'rgba(120,0,30,0)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, W, H);

  // particles + spikes
  ctx.beginPath();
  for (const p of parts) {
    const age = T - p.delay;
    const wob = Math.sin(T * 1.7 + p.ph) * 0.18;
    const push = b * p.kick + wob;
    const tx = CX + (p.tx * k + p.nx * push) * S;
    const ty = CY + (p.ty * k + p.ny * push) * S;
    let x, y, a;
    if (age < p.dur) {
      const e = ease(clamp01(age / p.dur));
      const sx = CX + p.sx * W, sy = CY + p.sy * H;
      const dx = tx - sx, dy = ty - sy, sw = Math.sin(Math.PI * e) * p.swirl;
      x = sx + dx * e - dy * sw;
      y = sy + dy * e + dx * sw;
      a = 0.12 + 0.88 * e;
    } else {
      x = tx; y = ty; a = 1;
      if (p.spike) {
        const L = p.slen * S * (0.5 + 0.9 * b + 0.25 * Math.sin(T * 2.3 + p.ph));
        ctx.moveTo(x, y);
        ctx.lineTo(x + p.sdx * L, y + p.sdy * L);
      }
    }
    a *= 0.6 * (0.7 + 0.3 * Math.sin(T * 3 + p.ph * 3));
    const sz = p.size * S * 0.32 * (1 + b * 0.15);
    ctx.globalAlpha = a;
    ctx.drawImage(p.spr, x - sz, y - sz, sz * 2, sz * 2);
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 1;
  ctx.strokeStyle = `rgba(255,90,130,${0.3 * appear})`;
  ctx.stroke();

  // bursts
  for (let i = bursts.length - 1; i >= 0; i--) {
    const p = bursts[i];
    p.life += dt;
    if (p.life > p.max) { bursts.splice(i, 1); continue; }
    const fr = Math.pow(0.12, dt);
    p.vx *= fr; p.vy *= fr;
    p.vy -= p.up * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const l = p.life / p.max;
    ctx.globalAlpha = (1 - l) * (1 - l);
    ctx.drawImage(p.spr, p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // text
  if (!textShown && T > 3.4) { love.classList.add('show'); textShown = true; }
  love.style.transform = `translate(-50%,-50%) scale(${1 + 0.03 * b})`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
