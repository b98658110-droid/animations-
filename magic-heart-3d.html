<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 55%, #071a3a 0%, #030a1c 45%, #000208 100%);
    cursor: grab;
    user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  body:active { cursor: grabbing; }
  canvas { position: fixed; inset: 0; display: block; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 4vh;
    text-align: center; pointer-events: none;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300;
    font-size: clamp(13px, 2.2vmin, 20px); letter-spacing: .25em;
    color: #bfdbfe; text-shadow: 0 0 10px rgba(80, 160, 255, .9);
    opacity: 0;
    animation: hint 9s ease 4.5s forwards;
  }
  @keyframes hint { 0% { opacity: 0; } 15% { opacity: .75; } 75% { opacity: .75; } 100% { opacity: 0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">нажми — вспыхнет ✦ потяни — повернётся</div>

<script>
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');

let W, H, S, HX, HY, PY, RX, RY;
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cvs.width = W * d; cvs.height = H * d;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
  S = Math.min(W, H * 0.9) * 0.021;   // 1 "heart unit" in pixels
  HX = W / 2; HY = H * 0.43;          // heart center
  PY = HY + 20 * S;                   // platform center
  RX = 14 * S; RY = 2.8 * S;          // platform radii
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function heartXY(t) {
  const s = Math.sin(t);
  return [16 * s * s * s, 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)];
}

function glowSprite(rgb) {
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.12, `rgba(${rgb},0.95)`);
  g.addColorStop(0.4, `rgba(${rgb},0.26)`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  x.fillStyle = g;
  x.fillRect(0, 0, s, s);
  return c;
}

const BLUE_SHADES = [
  glowSprite('59,130,246'),   // blue-500
  glowSprite('96,165,250'),   // blue-400
  glowSprite('147,197,253'),  // blue-300
  glowSprite('37,99,235'),    // blue-600
  glowSprite('56,189,248'),   // sky-400
];
const WHITE = glowSprite('230,245,255');
const CYAN = glowSprite('120,220,255');
const pick = () => BLUE_SHADES[(Math.random() * BLUE_SHADES.length) | 0];

// ---------- 3D heart point cloud ----------
const TH = 6.5;  // half-thickness of the heart
const N = Math.min(W, H) < 600 ? 1800 : 3200;
const pts = [];
for (let i = 0; i < N; i++) {
  const t = Math.random() * TAU;
  const [hx, hy] = heartXY(t);
  const u = Math.random();
  let r, z;
  if (u < 0.3) {                       // glowing outline
    r = 1 - Math.random() * 0.03;
    z = (Math.random() - 0.5) * 1.4;
  } else if (u < 0.85) {               // puffy surface
    r = Math.sqrt(Math.random());
    z = (Math.random() < 0.5 ? -1 : 1) * TH * Math.sqrt(1 - r * r);
  } else {                             // inner dust
    r = Math.sqrt(Math.random()) * 0.95;
    z = (Math.random() * 2 - 1) * TH * Math.sqrt(1 - r * r);
  }
  const sparkle = Math.random() < 0.1;
  const a0 = Math.random() * TAU, rr = Math.sqrt(Math.random());
  pts.push({
    x: hx * r, y: -(hy + 2.5) * r, z,
    // start on the glowing platform (heart units, relative to heart center)
    sx: Math.cos(a0) * rr * 14, sy: 20 + Math.sin(a0) * rr * 2.8,
    delay: rand(0.8, 3.6), dur: rand(1.8, 2.8), swirl: rand(-0.5, 0.5),
    size: sparkle ? rand(0.9, 1.6) : rand(0.5, 1.2),
    spr: sparkle ? WHITE : pick(),
    sparkle, ph: Math.random() * TAU,
  });
}

// ---------- platform ring ----------
const ring = Array.from({ length: 480 }, () => {
  const rim = Math.random() < 0.55;
  return {
    a: Math.random() * TAU,
    rr: rim ? rand(0.86, 1.03) : Math.sqrt(Math.random()) * 0.9,
    spd: rand(0.15, 0.55) * (Math.random() < 0.5 ? 1 : 1.4),
    size: rand(0.4, 1.1),
    spr: Math.random() < 0.3 ? CYAN : pick(),
    ph: Math.random() * TAU,
  };
});

// ---------- rising particles + stars ----------
const risers = [];
let riseAcc = 0;
const stars = Array.from({ length: 240 }, () => ({
  x: Math.random(), y: Math.random(), r: rand(0.4, 1.5), ph: Math.random() * TAU, sp: rand(0.4, 2),
}));

// ---------- click bursts ----------
const burstParticles = [];
function spawnHeartBurst(x, y) {
  const count = 140;
  for (let i = 0; i < count; i++) {
    let vx, vy;
    if (i % 2) {                       // expand as a heart
      const [hx, hy] = heartXY(i / count * TAU);
      const v = rand(11, 14);
      vx = hx * v; vy = -hy * v;
    } else {                           // random sparks
      const a = Math.random() * TAU, v = rand(50, 420);
      vx = Math.cos(a) * v; vy = Math.sin(a) * v;
    }
    burstParticles.push({ x, y, vx, vy, life: 0, max: rand(1, 1.9), size: rand(5, 13),
                          spr: Math.random() < 0.15 ? WHITE : pick() });
  }
}

// ---------- drag to rotate ----------
let dragging = false, lastX = 0, moved = 0, rotOff = 0, rotVel = 0;
addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; moved = 0; rotVel = 0; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  moved += Math.abs(dx);
  rotOff += dx * 0.008;
  rotVel = dx * 0.008;
});
addEventListener('pointerup', e => {
  if (dragging && moved < 6) spawnHeartBurst(e.clientX, e.clientY);
  dragging = false;
});

function beat(t) {
  const ph = t % 1.2;
  return Math.exp(-(((ph - 0.1) / 0.08) ** 2)) + 0.5 * Math.exp(-(((ph - 0.38) / 0.09) ** 2));
}

// ---------- loop ----------
const T0 = performance.now();
let last = T0;
const FOV = 60;

function frame(now) {
  const T = (now - T0) / 1000;
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!dragging) { rotOff += rotVel; rotVel *= 0.94; }
  const rotY = T * 0.45 + rotOff;
  const rotX = 0.12 + Math.sin(T * 0.35) * 0.08;
  const cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);

  const platA = clamp01(T / 1.4);
  const appear = clamp01((T - 1.5) / 3);
  const b = beat(T) * clamp01((T - 4.5) / 1.5);
  const k = 1 + 0.05 * b;

  ctx.clearRect(0, 0, W, H);

  // stars
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#cfe3ff';
  for (const s of stars) {
    ctx.globalAlpha = 0.12 + 0.5 * (0.5 + 0.5 * Math.sin(T * s.sp + s.ph));
    ctx.fillRect(s.x * W, s.y * H, s.r, s.r);
  }

  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1;

  // light beam from the platform
  const top = HY - 12 * S;
  const beam = ctx.createLinearGradient(0, PY, 0, top);
  beam.addColorStop(0, `rgba(70,160,255,${0.17 * platA * (0.85 + 0.3 * b)})`);
  beam.addColorStop(1, 'rgba(70,160,255,0)');
  ctx.fillStyle = beam;
  ctx.beginPath();
  ctx.moveTo(HX - RX * 0.95, PY); ctx.lineTo(HX + RX * 0.95, PY);
  ctx.lineTo(HX + RX * 0.55, top); ctx.lineTo(HX - RX * 0.55, top);
  ctx.fill();

  // soft glow behind the heart
  const hg = ctx.createRadialGradient(HX, HY - 2 * S, 0, HX, HY - 2 * S, 20 * S);
  hg.addColorStop(0, `rgba(40,110,255,${0.22 * appear * (0.8 + 0.4 * b)})`);
  hg.addColorStop(1, 'rgba(0,30,120,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, 0, W, H);

  // platform glow
  const pa = platA * (0.85 + 0.3 * b);
  ctx.save();
  ctx.translate(HX, PY);
  ctx.scale(1, RY / RX);
  const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, RX * 1.3);
  pg.addColorStop(0, `rgba(190,240,255,${0.8 * pa})`);
  pg.addColorStop(0.35, `rgba(60,175,255,${0.5 * pa})`);
  pg.addColorStop(0.72, `rgba(30,90,255,${0.16 * pa})`);
  pg.addColorStop(1, 'rgba(0,40,255,0)');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(0, 0, RX * 1.3, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.shadowBlur = 24; ctx.shadowColor = '#4fc3ff';
  ctx.strokeStyle = `rgba(170,230,255,${0.65 * pa})`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(HX, PY, RX, RY, 0, 0, TAU); ctx.stroke();
  ctx.restore();

  // platform swirling particles
  for (const p of ring) {
    p.a += p.spd * dt;
    const x = HX + Math.cos(p.a) * p.rr * RX * (1 + 0.04 * b);
    const y = PY + Math.sin(p.a) * p.rr * RY * (1 + 0.04 * b);
    const sz = p.size * S * 0.55;
    ctx.globalAlpha = platA * (0.45 + 0.35 * Math.sin(T * 3 + p.ph));
    ctx.drawImage(p.spr, x - sz, y - sz, sz * 2, sz * 2);
  }

  // rising particles
  riseAcc += dt * 45 * platA;
  while (riseAcc > 1) {
    riseAcc--;
    const a = Math.random() * TAU, rr = Math.sqrt(Math.random());
    risers.push({ x: HX + Math.cos(a) * rr * RX * 0.95, y: PY + Math.sin(a) * rr * RY,
                  vy: -rand(1.5, 4.5) * S, life: 0, max: rand(2, 4), size: rand(0.4, 1),
                  ph: Math.random() * TAU, spr: Math.random() < 0.3 ? CYAN : pick() });
  }
  for (let i = risers.length - 1; i >= 0; i--) {
    const p = risers[i];
    p.life += dt;
    if (p.life > p.max) { risers.splice(i, 1); continue; }
    p.y += p.vy * dt;
    const l = p.life / p.max;
    const x = p.x + Math.sin(T * 2 + p.ph) * S * 0.4;
    const sz = p.size * S * 0.5;
    ctx.globalAlpha = Math.sin(Math.PI * l) * 0.7;
    ctx.drawImage(p.spr, x - sz, p.y - sz, sz * 2, sz * 2);
  }

  // the heart
  for (const p of pts) {
    const age = T - p.delay;
    if (age <= 0) continue;

    const wob = Math.sin(T * 1.5 + p.ph) * 0.12;
    const lx = p.x * k + wob, ly = p.y * k + wob * 0.5, lz = p.z * k;

    // rotate (Y then X) and project
    const x1 = lx * cy + lz * sy;
    const z1 = -lx * sy + lz * cy;
    const y2 = ly * cx - z1 * sx;
    const z2 = ly * sx + z1 * cx;
    const sc = FOV / (FOV + z2);
    let px = HX + x1 * S * sc, py = HY + y2 * S * sc;
    let alpha = 0.25 + 0.75 * clamp01(0.5 - z2 / (TH * 2.4));

    if (age < p.dur) {   // fly up from the platform into place
      const e = ease(age / p.dur);
      const ox = HX + p.sx * S, oy = HY + p.sy * S;
      const dx = px - ox, dy = py - oy, sw = Math.sin(Math.PI * e) * p.swirl;
      px = ox + dx * e - dy * sw;
      py = oy + dy * e + dx * sw;
      alpha *= 0.2 + 0.8 * e;
    }

    const tw = p.sparkle
      ? 0.3 + 0.7 * Math.pow(0.5 + 0.5 * Math.sin(T * 4 + p.ph * 5), 3)
      : 0.75 + 0.25 * Math.sin(T * 2.5 + p.ph);
    const sz = p.size * S * 0.36 * sc * (1 + 0.15 * b);
    ctx.globalAlpha = alpha * tw * 0.75;
    ctx.drawImage(p.spr, px - sz, py - sz, sz * 2, sz * 2);
  }

  // bursts
  for (let i = burstParticles.length - 1; i >= 0; i--) {
    const p = burstParticles[i];
    p.life += dt;
    if (p.life > p.max) { burstParticles.splice(i, 1); continue; }
    const fr = Math.pow(0.12, dt);
    p.vx *= fr; p.vy *= fr;
    p.vy += 25 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const l = p.life / p.max;
    ctx.globalAlpha = (1 - l) * (1 - l);
    ctx.drawImage(p.spr, p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
